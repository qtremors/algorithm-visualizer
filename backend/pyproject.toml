[project]
name = "backend"
version = "0.1.1"
description = "High-performance algorithm visualizer with real-time streaming."
readme = "../README.md"
requires-python = ">=3.11"
authors = [
    { name = "Tremors", email = "hello@tremors.dev" }
]
license = { text = "TSL" }
keywords = ["algorithm", "visualization", "fastapi", "react", "sorting", "pathfinding"]
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",
    "websockets>=17.0.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=6.0.0",
    "pip-audit>=2.9.0",
    "ruff>=0.14.0",
    "httpx>=0.28.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.coverage.run]
source = ["app"]
branch = true
